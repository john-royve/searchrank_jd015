[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "john-royve-searchrank_jd015"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对搜索排序算法工程师·数据去重与污染检测相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "john-royve" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://john-royve.github.io"
Repository = "https://github.com/john-royve/searchrank_jd015"
Issues = "https://github.com/john-royve/searchrank_jd015/issues"

[project.scripts]
searchrank_jd015 = "searchrank_jd015:main"

[tool.setuptools]
py-modules = ["searchrank_jd015"]
